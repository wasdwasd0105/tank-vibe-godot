[theme]

name="JueZhuanTanKe"
type="image"
tile_size=16
tile_scale=2

[tiles]

ice="maps/ice.bmp"
water="maps/river.bmp"
grass="maps/grass.bmp"
burned_grass="maps/grass_burned.bmp"
ground="maps/ground.bmp"
soft_brick_full="maps/soft_brick_full.bmp"
soft_brick_tl="maps/soft_brick_tl.bmp"
soft_brick_tr="maps/soft_brick_tr.bmp"
soft_brick_bl="maps/soft_brick_bl.bmp"
soft_brick_br="maps/soft_brick_br.bmp"
soft_brick_tl_tr="maps/soft_brick_tl_tr.bmp"
soft_brick_tl_bl="maps/soft_brick_tl_bl.bmp"
soft_brick_tr_br="maps/soft_brick_tr_br.bmp"
soft_brick_bl_br="maps/soft_brick_bl_br.bmp"
hard_brick_4="maps/hard_brick_4.bmp"
hard_brick_3="maps/hard_brick_3.bmp"
hard_brick_2="maps/hard_brick_2.bmp"
hard_brick_1="maps/hard_brick_1.bmp"
iron_brick="maps/iron_brick.bmp"
super_brick="maps/super_brick.bmp"

[tanks]

mode="sprite"
tank_p1="tanks/tank_p1.bmp"
tank_p2="tanks/tank_p2.bmp"

[base]

; Original flag strip: 3 rows of 8 frames (healthy, dead, invincible).
flag="flag.png"
frame_size=32
frames=8

[sounds]

; Sounds are resolved per theme: any .wav placed in this folder whose name
; matches one in res://assets/sounds/ replaces that sound for this theme only.
; Anything not present here falls back to the shared default set.
dir="sounds/"

[effects]

; What a bullet shows when it hits a wall, block, tank or another shot: a
; horizontal strip of square frames, played once centred where it died. These
; are the original's own strips, picked per weapon exactly as Tank.exe does
; (table at 0x4d2cd8): _B_16 for regular/rapid, _B_32A for fire, _B_32B for
; AP and explosion shells.
hit_regular="effects/hit_small.png"
hit_rapid="effects/hit_small.png"
hit_fire="effects/hit_fire.png"
hit_ap="effects/hit_heavy.png"
hit_explosion="effects/hit_heavy.png"
; The original plays the 8 frames at 0.03 frames per 0.75 ms tick.
hit_duration=0.2
; A destroyed tank turns into the original's 48 px explosion (_B_48, image 9 in
; Tank.exe's death routine at 0x491e2c): 8 frames at 0.015 frames per tick.
tank_explode="effects/tank_explode.png"
tank_explode_duration=0.4
